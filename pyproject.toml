[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-agent-selfhosted"
version = "0.1.0"
description = "Small, self-hosted, multi-channel personal AI agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=20,<23"]
discord = ["discord.py>=2.3,<3"]
slack = ["slack-bolt>=1.18,<2", "aiohttp>=3.9,<4"]
wechat = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
pdf = ["pypdf>=4,<7"]
all = ["python-telegram-bot>=20,<23", "discord.py>=2.3,<3", "slack-bolt>=1.18,<2", "aiohttp>=3.9,<4", "fastapi>=0.110,<1", "uvicorn>=0.27,<1", "pypdf>=4,<7"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
pocket-agent = "pocket_agent.__main__:main"

[tool.setuptools.packages.find]
include = ["pocket_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
